[package]
name = "edge-deck"
version = "0.1.0"
description = "Fullscreen touch app for a 2560x720 display"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "edge_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tungstenite = "0.30.0"
# The ingest engine and live views behind the Code setup. Pinned to strate main.
strate-core = { git = "https://github.com/Crawford-Young/strate", rev = "00569e9" }
# The reader connection type strate-core's views take; same version strate-core locks.
rusqlite = "0.41.1"

# Terminal focus. Same version tauri already locks, so no second copy builds.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }
